<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlowMaskable" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1220" />
      <stop offset="60%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <filter id="cyanGlowM" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22d3ee" flood-opacity="0.85" />
    </filter>
    <filter id="indigoGlowM" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#818cf8" flood-opacity="0.8" />
    </filter>
    <filter id="magentaGlowM" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ec4899" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Full bleed black background for Android maskable icons -->
  <rect width="512" height="512" fill="#000000" />
  <rect width="512" height="512" fill="url(#bgGlowMaskable)" />

  <g transform="translate(51.2, 51.2) scale(0.8)">
    <g id="leftEqualizerPillar">
      <rect x="114" y="372" width="48" height="30" rx="10" fill="#0284c7" stroke="#082f49" stroke-width="1.5" />
      <rect x="114" y="334" width="48" height="30" rx="10" fill="#0369a1" stroke="#0c4a6e" stroke-width="1.5" />
      <rect x="114" y="296" width="48" height="30" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
      <rect x="114" y="258" width="48" height="30" rx="10" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5" />
      <rect x="114" y="220" width="48" height="30" rx="10" fill="#0ea5e9" stroke="#0369a1" stroke-width="1.5" />
      <rect x="114" y="182" width="48" height="30" rx="10" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1.5" />
      <rect x="114" y="144" width="48" height="30" rx="10" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1.5" />
      <rect x="114" y="106" width="48" height="30" rx="10" fill="#a5f3fc" filter="url(#cyanGlowM)" />
      <circle cx="138" cy="86" r="4.5" fill="#38bdf8" filter="url(#cyanGlowM)" />
    </g>

    <g id="diagonalEqualizerStroke">
