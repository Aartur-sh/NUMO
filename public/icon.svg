<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Pitch Black Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0c1220" />
      <stop offset="60%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Neon Cyan & Sky Glow Filter (Left Equalizer Pillar) -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#22d3ee" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#0ea5e9" flood-opacity="0.5" />
    </filter>

    <!-- Deep Indigo & Violet Glow Filter (Diagonal Equalizer Stroke) -->
    <filter id="indigoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#818cf8" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>

    <!-- Vibrant Magenta & Pink Glow Filter (Right Equalizer Pillar) -->
    <filter id="magentaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ec4899" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#f43f5e" flood-opacity="0.5" />
    </filter>

    <!-- Subtle Metallic Outer Border Gradient -->
    <linearGradient id="borderBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- 1. Pure Obsidian Squircle Container -->
  <rect width="512" height="512" rx="128" fill="#000000" />
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="url(#borderBevel)" stroke-width="3" opacity="0.65" />

  <!-- 2. Ambient Atmosphere behind Letter 'N' -->
  <ellipse cx="140" cy="256" rx="90" ry="140" fill="#0284c7" opacity="0.12" filter="blur(30px)" />
  <ellipse cx="256" cy="256" rx="100" ry="100" fill="#6366f1" opacity="0.14" filter="blur(32px)" />
  <ellipse cx="372" cy="256" rx="90" ry="140" fill="#db2777" opacity="0.12" filter="blur(30px)" />

  <!-- 
    3. THE LETTER 'N' EQUALIZER LOGO
    Consists of 3 Equalizer Bars / Columns:
    - Pillar 1 (Left): Electric Cyan Segmented Vertical Equalizer
    - Pillar 2 (Diagonal): Chromatic Indigo-Violet Segmented Diagonal Equalizer
    - Pillar 3 (Right): Vibrant Magenta-Pink Segmented Vertical Equalizer
  -->
  <g id="letterN-Equalizer">
    
    <!-- ============================================== -->
    <!-- PILLAR 1: LEFT VERTICAL EQUALIZER (x: 114..162, y: 104..408) -->
    <!-- ============================================== -->
    <g id="leftEqualizerPillar">
      <!-- Segment 1 (Base) -->
      <rect x="114" y="372" width="48" height="30" rx="10" fill="#0284c7" stroke="#082f49" stroke-width="1.5" />
      <!-- Segment 2 -->
      <rect x="114" y="334" width="48" height="30" rx="10" fill="#0369a1" stroke="#0c4a6e" stroke-width="1.5" />
      <!-- Segment 3 -->
      <rect x="114" y="296" width="48" height="30" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
      <!-- Segment 4 -->
      <rect x="114" y="258" width="48" height="30" rx="10" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5" />
      <!-- Segment 5 -->
      <rect x="114" y="220" width="48" height="30" rx="10" fill="#0ea5e9" stroke="#0369a1" stroke-width="1.5" />
      <!-- Segment 6 -->
      <rect x="114" y="182" width="48" height="30" rx="10" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1.5" />
      <!-- Segment 7 -->
      <rect x="114" y="144" width="48" height="30" rx="10" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1.5" />
      <!-- Segment 8 (Peak Glowing Cyan LED) -->
      <rect x="114" y="106" width="48" height="30" rx="10" fill="#a5f3fc" filter="url(#cyanGlow)" />
      
      <!-- Top VU Peak Indicator Dot -->
      <circle cx="138" cy="86" r="4.5" fill="#38bdf8" filter="url(#cyanGlow)" />
    </g>

    <!-- ============================================== -->
    <!-- PILLAR 2: DIAGONAL EQUALIZER (from ~(168,138) to ~(344,374)) -->
    <!-- ============================================== -->
    <g id="diagonalEqualizerStroke">
      <!-- Diag Segment 1 (Top-Left, Sky Blue) -->
      <g transform="translate(176, 142) rotate(38)">
        <rect x="-23" y="-14" width="46" height="28" rx="9" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
      </g>
      
      <!-- Diag Segment 2 (Sky-Royal) -->
      <g transform="translate(202, 178) rotate(38)">
        <rect x="-23" y="-14" width="46" height="28" rx="9" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5" />
      </g>
      
      <!-- Diag Segment 3 (Royal Blue) -->
      <g transform="translate(228, 214) rotate(38)">
        <rect x="-23" y="-14" width="46" height="28" rx="9" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" />
      </g>
      
      <!-- Diag Segment 4 (Indigo Center Core) -->
      <g transform="translate(256, 256) rotate(38)">
        <rect x="-24" y="-15" width="48" height="30" rx="10" fill="#818cf8" filter="url(#indigoGlow)" />
      </g>

      <!-- Diag Segment 5 (Deep Indigo) -->
      <g transform="translate(284, 298) rotate(38)">
        <rect x="-23" y="-14" width="46" height="28" rx="9" fill="#6366f1" stroke="#4338ca" stroke-width="1.5" />
      </g>

      <!-- Diag Segment 6 (Electric Violet) -->
      <g transform="translate(310, 334) rotate(38)">
        <rect x="-23" y="-14" width="46" height="28" rx="9" fill="#a855f7" stroke="#7e22ce" stroke-width="1.5" />
      </g>

      <!-- Diag Segment 7 (Bottom-Right Violet-Magenta) -->
      <g transform="translate(336, 370) rotate(38)">
        <rect x="-23" y="-14" width="46" height="28" rx="9" fill="#c084fc" stroke="#9333ea" stroke-width="1.5" />
      </g>
    </g>

    <!-- ============================================== -->
    <!-- PILLAR 3: RIGHT VERTICAL EQUALIZER (x: 350..398, y: 104..408) -->
    <!-- ============================================== -->
    <g id="rightEqualizerPillar">
      <!-- Segment 1 (Base) -->
      <rect x="350" y="372" width="48" height="30" rx="10" fill="#701a75" stroke="#4a044e" stroke-width="1.5" />
      <!-- Segment 2 -->
      <rect x="350" y="334" width="48" height="30" rx="10" fill="#86198f" stroke="#581c87" stroke-width="1.5" />
      <!-- Segment 3 -->
      <rect x="350" y="296" width="48" height="30" rx="10" fill="#a21caf" stroke="#701a75" stroke-width="1.5" />
      <!-- Segment 4 -->
      <rect x="350" y="258" width="48" height="30" rx="10" fill="#c026d3" stroke="#86198f" stroke-width="1.5" />
      <!-- Segment 5 -->
      <rect x="350" y="220" width="48" height="30" rx="10" fill="#d946ef" stroke="#a21caf" stroke-width="1.5" />
      <!-- Segment 6 -->
      <rect x="350" y="182" width="48" height="30" rx="10" fill="#ec4899" stroke="#be185d" stroke-width="1.5" />
      <!-- Segment 7 -->
      <rect x="350" y="144" width="48" height="30" rx="10" fill="#f43f5e" stroke="#db2777" stroke-width="1.5" />
      <!-- Segment 8 (Peak Glowing Pink/Magenta LED) -->
      <rect x="350" y="106" width="48" height="30" rx="10" fill="#ffe4e6" filter="url(#magentaGlow)" />

      <!-- Top VU Peak Indicator Dot -->
      <circle cx="374" cy="86" r="4.5" fill="#f43f5e" filter="url(#magentaGlow)" />
    </g>

  </g>

  <!-- 4. Subtle Bottom Sound Baseline Grid -->
  <g opacity="0.35">
    <line x1="104" y1="422" x2="408" y2="422" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <circle cx="138" cy="422" r="3" fill="#0284c7" />
    <circle cx="256" cy="422" r="3" fill="#6366f1" />
    <circle cx="374" cy="422" r="3" fill="#ec4899" />
  </g>
</svg>
